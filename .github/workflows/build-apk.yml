name: Build Signed APK

# The app is fully self-contained: there is no backend to configure, so this
# workflow only has to build, sign and publish the APK.
#
# Action versions below were checked against the latest published releases in
# September 2026: checkout v7, setup-java v6, upload-artifact v7.
#
# gradle/actions/setup-gradle is deliberately NOT used: from v6 its caching
# component is a proprietary, separately-licensed library. setup-java's built-in
# Gradle cache covers the same ground under the standard MIT terms.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # JDK 17 is both the minimum and the default for AGP 9.3.
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK packages
        # The hosted image already ships the platform and build-tools this
        # project needs, so a failure here is informational, not fatal — AGP can
        # still download what it needs (licences are pre-accepted on the image).
        #
        # Note the package name: since Android 16 QPR the SDK uses
        # minor-versioned platforms, so API level 37 is "android-37.0", not
        # "android-37".
        run: |
          set -uo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "${SDKMANAGER}" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null \
            || echo "::warning::sdkmanager could not install those packages; using the preinstalled SDK."
          echo "Available platforms:"; ls -1 "${ANDROID_HOME}/platforms"
          echo "Available build-tools:"; ls -1 "${ANDROID_HOME}/build-tools"

      - name: Check the bundled phone database is valid JSON
        # The app cannot recommend anything without this asset, and a typo in it
        # would only surface as a runtime crash on the user's phone.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          with open('app/src/main/assets/phones.json') as fh:
              data = json.load(fh)
          phones = data['phones']
          required = ('manufacturer', 'model', 'screen_size_inches',
                      'density_dpi', 'refresh_rate_hz', 'touch_sampling_rate_hz')
          ranges = {'screen_size_inches': (3.0, 12.0),
                    'refresh_rate_hz': (24, 480),
                    'touch_sampling_rate_hz': (30, 3000)}
          errors = []
          seen = set()
          for phone in phones:
              label = phone.get('model') or '<no model>'
              if label in seen:
                  errors.append(f'{label}: duplicate model')
              seen.add(label)
              for key in required:
                  if phone.get(key) in (None, ''):
                      errors.append(f'{label}: missing {key}')
              for key, (low, high) in ranges.items():
                  value = phone.get(key)
                  if isinstance(value, (int, float)) and not low <= value <= high:
                      errors.append(f'{label}: {key}={value} is outside {low}-{high}')
          print(f'{len(phones)} phones in the bundled database')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "No KEYSTORE_BASE64 secret set — the release APK will be signed"
            echo "with the debug key and is NOT distributable."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > app/release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease

      - name: Verify the APK is signed with the release key
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Verifying ${APK}"
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)
          "${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    # Only for version tags, e.g. git tag v1.0.0 && git push origin v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: app-release-signed
          path: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" apk/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BGMI Sensitivity ${TAG}" \
            --generate-notes
