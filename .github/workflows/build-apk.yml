name: Build Signed APK

# Action versions below were checked against the latest published releases in
# September 2026: checkout v7, setup-java v6, upload-artifact v7.
#
# gradle/actions/setup-gradle is deliberately NOT used: from v6 its caching
# component is a proprietary, separately-licensed library. setup-java's built-in
# Gradle cache covers the same ground under the standard MIT terms.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # JDK 17 is both the minimum and the default for AGP 9.3.
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        # The hosted image does not always carry the newest platform. Installing
        # explicitly avoids relying on AGP's implicit SDK download.
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Lint PHP backend
        run: |
          set -euo pipefail
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "No KEYSTORE_BASE64 secret set — the release APK will be signed"
            echo "with the debug key and is NOT distributable."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > app/release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Point the app at your deployed API without editing gradle.properties.
          # Add a repository variable named API_BASE_URL to override the default.
          BGMI_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${BGMI_API_BASE_URL}" ]; then
            ARGS="-Pbgmi.apiBaseUrl=${BGMI_API_BASE_URL}"
          fi
          ./gradlew --no-daemon assembleRelease ${ARGS}

      - name: Verify the APK is signed with the release key
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Verifying ${APK}"
          BUILD_TOOLS=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)
          "${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    # Only for version tags, e.g. git tag v1.0.0 && git push origin v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: app-release-signed
          path: apk

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" apk/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BGMI Sensitivity ${TAG}" \
            --generate-notes
