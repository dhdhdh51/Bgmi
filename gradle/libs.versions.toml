#
# Version catalogue.
#
# Every version below was verified against currently published releases in
# September 2026 rather than copied from memory. See README.md ("Tooling
# versions") for the verification notes and how to bump them safely.
#
[versions]
# Android Gradle plugin 9.3.0 (July 2026). Requires Gradle 9.5+, JDK 17+,
# SDK build-tools 36.0.0, and supports up to API level 37.
agp = "9.3.0"

# There is deliberately no `kotlin` version here: AGP 9.x has built-in Kotlin
# support and brings its own Kotlin Gradle plugin, so the project neither
# declares nor applies org.jetbrains.kotlin.android. Add a `kotlin` version only
# if you introduce a Kotlin compiler plugin (compose / parcelize /
# serialization), and match it to the Kotlin version AGP bundles — check with
# `./gradlew :app:dependencies --configuration kotlinCompilerClasspath`.

# AndroidX / Material
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-constraintlayout = "2.2.1"
androidx-core = "1.19.0"
androidx-lifecycle = "2.11.0"
androidx-recyclerview = "1.4.0"
material = "1.14.0"

# Coroutines (used for the networking layer)
coroutines = "1.11.0"

# Test
androidx-test-ext-junit = "1.3.0"
espresso = "3.7.0"
junit = "4.13.2"

[libraries]
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
material = { module = "com.google.android.material:material", version.ref = "material" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
