# Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is mandatory for AGP 9.x
android.useAndroidX=true

# ---------------------------------------------------------------------------
# Backend base URL baked into BuildConfig.API_BASE_URL.
#
# Must end with a trailing slash and should point at the directory that holds
# the PHP front controller, e.g. https://api.example.com/api/
#
# Override without editing this file:
#   ./gradlew assembleRelease -Pbgmi.apiBaseUrl=https://api.example.com/api/
# or put the same line in your (git-ignored) local.properties.
# ---------------------------------------------------------------------------
bgmi.apiBaseUrl=https://example.com/api/
